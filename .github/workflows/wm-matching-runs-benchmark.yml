name: Wavelet matching runs benchmark

on:
  pull_request:
    paths:
      - 'src/nbvs/wavelet_matching_runs.nim'
      - 'src/nbvs/wavelet_select_cursor.nim'
      - 'src/nbvs/wavelet_matrix.nim'
      - 'benchmarks/wm_matching_runs_perf.nim'
      - '.github/workflows/wm-matching-runs-benchmark.yml'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.10'
      - name: Scalar benchmark
        run: |
          nim c --path:src -d:release --mm:arc benchmarks/wm_matching_runs_perf.nim
          ./benchmarks/wm_matching_runs_perf | tee wm_matching_runs_scalar.csv
      - name: SIMD benchmark
        run: |
          nim c --path:src -d:release -d:nbvsSimd --mm:arc benchmarks/wm_matching_runs_perf.nim
          ./benchmarks/wm_matching_runs_perf | tee wm_matching_runs_simd.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wm-matching-runs-results
          path: |
            wm_matching_runs_scalar.csv
            wm_matching_runs_simd.csv
